version: 2

models:
  - name: fact_hospitalizations
    description: >
      Fact table with one row per hospital admission, ready for business analysis.
      Grain: one row per admission_id. Joins to dim_date on the date keys and to
      dim_municipality on the municipality code columns.
    columns:
      - name: admission_id
        description: Unique hospital admission identifier (AIH number). Primary key of this fact table.
        tests:
          - unique
          - not_null
      - name: admission_date_key
        description: Foreign key to `dim_date.date_key`, representing the admission date.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: discharge_date_key
        description: Foreign key to `dim_date.date_key`, representing the discharge date.
      - name: competency_year
        description: >
          Year of the SIH-SUS competência (reporting period) — the year of the source file this
          record was published under, NOT a clinical date. Distinct from admission/discharge dates:
          a long admission can be reported under a later competência than when it started. This is
          the correct field for detecting source-file gaps (see "Known Data Gaps" in docs/PROJECT.md) —
          `admission_date`/`discharge_date` alone can mask a missing competência file, since some of
          its admissions may already appear under a later month's file.
      - name: competency_month
        description: Month of the SIH-SUS competência (reporting period). See `competency_year`.
      - name: patient_municipality_code
        description: Foreign key to `dim_municipality.municipality_code`, the patient's residence municipality.
      - name: hospital_municipality_code
        description: Foreign key to `dim_municipality.municipality_code`, the hospital's municipality.
      - name: hospital_cnes_code
        description: CNES code identifying the hospital where the admission took place.
      - name: sex
        description: Patient sex (M, F, or U for unknown).
      - name: age
        description: Patient's age at admission, in years.
      - name: primary_diagnosis_code
        description: Primary diagnosis for the admission, as an ICD-10 (CID-10) code.
      - name: secondary_diagnosis_code
        description: Secondary diagnosis, as an ICD-10 (CID-10) code (null when not reported).
      - name: bed_specialty_code
        description: Code for the hospital bed/ward specialty used for the admission.
      - name: died
        description: True if the patient died during this admission.
      - name: race_color_code
        description: Patient's self-declared race/color code, per IBGE classification.
      - name: length_of_stay_days
        description: Number of days the patient stayed admitted.
      - name: total_cost
        description: Total approved cost of the admission, in BRL.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: icu_cost
        description: Portion of the total cost attributable to ICU care, in BRL.
