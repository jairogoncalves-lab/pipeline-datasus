version: 2

models:
  - name: silver_hospitalizations
    description: One row per hospital admission (AIH), cleaned and standardized from the SIH-SUS bronze layer.
    columns:
      - name: admission_id
        description: Unique hospital admission identifier (AIH number).
        tests:
          - unique
          - not_null
      - name: sex
        description: Patient sex (M, F, or U for unknown).
        tests:
          - accepted_values:
              arguments:
                values: ["M", "F", "U"]
      - name: total_cost
        description: Total cost of the admission (BRL).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: length_of_stay_days
        description: Number of days the patient stayed admitted.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: admission_date
        description: Date the patient was admitted.
        tests:
          - not_null
