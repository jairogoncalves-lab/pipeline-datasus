version: 2

models:
  - name: fact_hospitalizations
    description: Fact table with one row per hospital admission, ready for business analysis.
    columns:
      - name: admission_id
        tests:
          - unique
          - not_null
      - name: admission_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: total_cost
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: dim_date
    description: One row per calendar date present in the fact table (admission or discharge).
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_municipality
    description: Distinct municipalities (IBGE 6-digit code) referenced as patient residence or hospital location.
    columns:
      - name: municipality_code
        tests:
          - unique
          - not_null
