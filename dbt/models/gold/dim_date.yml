version: 2

models:
  - name: dim_date
    description: >
      One row per calendar date present in the fact table, either as an admission
      or a discharge date. Used to slice fact_hospitalizations by day/month/year/weekday.
    columns:
      - name: date_day
        description: The calendar date.
      - name: date_key
        description: Integer surrogate key for the date, in `YYYYMMDD` format.
        tests:
          - unique
          - not_null
      - name: year
        description: Calendar year of the date.
      - name: month
        description: Calendar month of the date (1-12).
      - name: day
        description: Day of the month (1-31).
      - name: quarter
        description: Calendar quarter of the date (1-4).
      - name: day_of_week
        description: Day of the week as a number (0 = Sunday).
      - name: day_name
        description: Full weekday name (e.g. "Monday").
      - name: month_name
        description: Full month name (e.g. "January").
